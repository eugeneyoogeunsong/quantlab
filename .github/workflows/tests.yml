name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The suite is fully offline -- it uses the SyntheticSource and never
      # calls a price vendor. Tests that hit a live API are flaky by
      # construction and would fail on a Sunday or behind a firewall.
      - name: Run tests
        run: pytest -v

      - name: Lint
        run: ruff check quantlab tests
        continue-on-error: true
