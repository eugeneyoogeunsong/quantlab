[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.1.0"
description = "A 5-layer algorithmic trading research framework with an executable backtest QA checklist"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Eugene Song", email = "ygsong1004@gmail.com" },
    { name = "Adrian" },
]
keywords = [
    "backtesting", "quantitative-finance", "algorithmic-trading",
    "factor-investing", "options-pricing", "derivatives", "portfolio-optimisation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "yfinance>=0.2.40",
    "pyarrow>=14.0",
]

[project.urls]
Homepage = "https://github.com/eugeneyoogeunsong/quantlab"
Repository = "https://github.com/eugeneyoogeunsong/quantlab"
Issues = "https://github.com/eugeneyoogeunsong/quantlab/issues"

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]

[project.scripts]
quantlab = "quantlab.cli:main"

[tool.setuptools.packages.find]
include = ["quantlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: Monte Carlo null-hypothesis tests. Skip with -m 'not slow'.",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
